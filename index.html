<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo-sajt</title>
<style>
  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --text: #222;
    --muted: #666;
    --bg: #f9f9f7;
    --white: #fff;
    --radius: 12px;
    --max: 900px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Georgia, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* NAV */
  nav {
    background: var(--primary);
    color: white;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  nav .logo { font-weight: 700; font-size: 18px; letter-spacing: -0.3px; }
  nav a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; }
  nav a:hover { color: white; }

  /* SECTIONS */
  section {
    max-width: var(--max);
    margin: 0 auto;
    padding: 60px 24px;
  }

  /* HERO */
  .block-imageText.hero-block {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: center;
    min-height: 60vh;
    max-width: 100%;
    padding: 80px 48px;
    background: var(--primary);
    color: white;
  }

  .block-imageText.hero-block .img-wrap {
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 4/3;
  }

  .block-imageText.hero-block img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .block-imageText.hero-block .img-placeholder {
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    border-radius: var(--radius);
    min-height: 200px;
  }

  .block-imageText.hero-block h1 {
    font-size: clamp(26px, 4vw, 42px);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .block-imageText.hero-block p {
    font-size: 16px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 28px;
  }

  .btn-cta {
    display: inline-block;
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    transition: opacity 0.2s;
  }

  .btn-cta:hover { opacity: 0.85; }

  /* PARAGRAPH */
  .block-paragraph {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    margin: 0 auto;
    padding: 48px 48px;
    max-width: var(--max);
  }

  .block-paragraph h2 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--primary);
  }

  .block-paragraph p { color: var(--muted); font-size: 16px; max-width: 600px; }

  /* IMAGE TEXT (non-hero) */
  .block-imageText:not(.hero-block) {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: center;
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    padding: 0;
    max-width: var(--max);
  }

  .block-imageText:not(.hero-block) .img-wrap {
    aspect-ratio: 4/3;
    overflow: hidden;
  }

  .block-imageText:not(.hero-block) img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .block-imageText:not(.hero-block) .img-placeholder {
    width: 100%;
    height: 100%;
    min-height: 200px;
    background: #f0f0ee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }

  .block-imageText:not(.hero-block) .content { padding: 40px; }

  .block-imageText:not(.hero-block) h2 {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
  }

  .block-imageText:not(.hero-block) p { color: var(--muted); font-size: 15px; }

  /* CONTACT */
  .block-contact {
    background: var(--primary);
    color: white;
    border-radius: var(--radius);
    max-width: var(--max);
    margin: 0 auto 60px;
    padding: 48px;
  }

  .block-contact h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .block-contact .intro { color: rgba(255,255,255,0.7); margin-bottom: 28px; }
  .contact-list { display: flex; flex-direction: column; gap: 12px; }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
  }

  .contact-item .icon {
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .contact-item a { color: white; text-decoration: none; }
  .contact-item a:hover { text-decoration: underline; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 32px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid #e8e8e4;
  }

  /* SECTION WRAPPER */
  .section-wrap { padding: 40px 24px; max-width: calc(var(--max) + 48px); margin: 0 auto; }

  /* LOADING */
  #loading { text-align: center; padding: 80px 24px; color: var(--muted); font-size: 16px; }

  /* RESPONSIVE */
  @media (max-width: 680px) {
    .block-imageText.hero-block {
      grid-template-columns: 1fr;
      padding: 48px 24px;
      min-height: auto;
    }
    .block-imageText.hero-block .img-wrap { display: none; }
    .block-imageText:not(.hero-block) { grid-template-columns: 1fr; }
    .block-imageText:not(.hero-block) .img-wrap { aspect-ratio: 16/9; }
    .block-contact { padding: 32px 24px; }
    .block-paragraph { padding: 32px 24px; }
  }
</style>
</head>
<body>

<nav>
  <span class="logo">Demo-sajt</span>
  <a href="admin/">Admin ✏️</a>
</nav>

<div id="loading">Laddar innehåll...</div>
<main id="site" style="display:none;"></main>

<footer id="footer" style="display:none;">
  <p>© 2025 Demo-sajt &nbsp;·&nbsp; Byggd med <a href="https://github.com/etxgmg/nano-cms" style="color:inherit;">nano-cms</a></p>
</footer>

<script>
(async function() {
  try {
    const res = await fetch('./content.json');
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    renderSite(data);
  } catch(e) {
    document.getElementById('loading').textContent = 'Kunde inte ladda innehåll.';
  }
})();

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function imgOrPlaceholder(src, alt, emoji) {
  if (src) return `<div class="img-wrap"><img src="${esc(src)}" alt="${esc(alt||'')}"></div>`;
  return `<div class="img-wrap"><div class="img-placeholder">${emoji||'🖼️'}</div></div>`;
}

function renderSite(data) {
  const site = document.getElementById('site');
  let isFirst = true;

  (data.blocks || []).forEach(block => {
    const e = block.editable || {};

    if (block.type === 'imageText' && isFirst) {
      // Hero
      const heroDiv = document.createElement('div');
      heroDiv.className = 'block-imageText hero-block';
      heroDiv.id = block.id;
      heroDiv.innerHTML = `
        <div class="text-col">
          ${e.title ? `<h1>${esc(e.title)}</h1>` : ''}
          ${e.text  ? `<p>${esc(e.text)}</p>` : ''}
          ${e.buttonText ? `<a href="${esc(e.buttonHref||'#')}" class="btn-cta">${esc(e.buttonText)}</a>` : ''}
        </div>
        ${imgOrPlaceholder(e.image, e.alt, '🏠')}
      `;
      site.appendChild(heroDiv);
      isFirst = false;

    } else if (block.type === 'imageText') {
      const wrap = document.createElement('div');
      wrap.className = 'section-wrap';
      const sec = document.createElement('section');
      sec.className = 'block-imageText';
      sec.id = block.id;
      sec.innerHTML = `
        ${imgOrPlaceholder(e.image, e.alt, '📷')}
        <div class="content">
          ${e.title ? `<h2>${esc(e.title)}</h2>` : ''}
          ${e.text  ? `<p>${esc(e.text)}</p>` : ''}
        </div>
      `;
      wrap.appendChild(sec);
      site.appendChild(wrap);
      isFirst = false;

    } else if (block.type === 'paragraph') {
      const wrap = document.createElement('div');
      wrap.className = 'section-wrap';
      const sec = document.createElement('section');
      sec.className = 'block-paragraph';
      sec.id = block.id;
      sec.innerHTML = `
        ${e.title ? `<h2>${esc(e.title)}</h2>` : ''}
        ${e.text  ? `<p>${esc(e.text)}</p>` : ''}
      `;
      wrap.appendChild(sec);
      site.appendChild(wrap);
      isFirst = false;

    } else if (block.type === 'contact') {
      const wrap = document.createElement('div');
      wrap.className = 'section-wrap';
      const sec = document.createElement('section');
      sec.className = 'block-contact';
      sec.id = block.id;

      let items = '';
      if (e.tel)     items += `<div class="contact-item"><div class="icon">📞</div><a href="tel:${esc(e.tel)}">${esc(e.tel)}</a></div>`;
      if (e.email)   items += `<div class="contact-item"><div class="icon">✉️</div><a href="mailto:${esc(e.email)}">${esc(e.email)}</a></div>`;
      if (e.address) items += `<div class="contact-item"><div class="icon">📍</div><span>${esc(e.address)}</span></div>`;

      sec.innerHTML = `
        ${e.title ? `<h2>${esc(e.title)}</h2>` : ''}
        ${e.text  ? `<p class="intro">${esc(e.text)}</p>` : ''}
        <div class="contact-list">${items}</div>
      `;
      wrap.appendChild(sec);
      site.appendChild(wrap);
      isFirst = false;
    }
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('site').style.display = 'block';
  document.getElementById('footer').style.display = 'block';
}
</script>
</body>
</html>
